name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3) Set up Node.js (pnpm needs it)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4) Install all dependencies (workspace aware)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5) Build design tokens
      - name: Build tokens
        run: pnpm --filter @kumiui/tokens run build

      # 6) Build the React library
      - name: Build components
        run: pnpm --filter @kumiui/react run build

      # 7) Type check the React library
      - name: Type check
        run: pnpm --filter @kumiui/react run typecheck

      # 8) Run unit tests
      - name: Run tests
        run: pnpm test